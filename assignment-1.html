<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>
        body {
            background-color: lightgray;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        p {
            font-size: 18px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>My Profile</h1>

    <p>
        Hello! My name is Alex.
        I am learning web development.
        I want to become a professional web developer.
    </p>

    <h2>My Goals</h2>

    <p>
        My goals are to learn HTML, CSS and JavaScript,
        build real websites and start earning as a web developer.
    </p>

    <button onclick="showMessage()">Click Me</button>


    <script>
        console.log("Welcome to my profile!");

        function showMessage() {
            alert("Thanks for visiting my profile!");
        }
    </script>

</body>
</html>
