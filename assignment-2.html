<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Introduction</title>

    <style>
        body {
            background-color: #e8ecf1;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        .card {
            width: 320px;
            background-color: white;
            margin: auto;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        h1 {
            color: #222;
            margin-bottom: 5px;
        }

        .role {
            color: #666;
            font-size: 17px;
        }

        p {
            line-height: 1.6;
        }

        ul {
            text-align: left;
            display: inline-block;
        }

        a {
            display: inline-block;
            margin: 15px 0;
            color: #0066cc;
            text-decoration: none;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #444;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <div class="card">

        <img
            class="profile-image"
            src="https://via.placeholder.com/120"
            alt="Profile Picture"
        >

        <h1>Manoj Kumar</h1>

        <div class="role">
            Web Developer in Making
        </div>

        <p>
            I am learning web development and building my
            skills in HTML, CSS and JavaScript.
        </p>

        <h2>My Skills</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <br>

        <a href="https://www.google.com" target="_blank">
            Visit My Portfolio
        </a>

        <br>

        <button onclick="showMessage()">
            Show Message
        </button>

        <div id="message"></div>

    </div>


    <script>

        function showMessage() {

            document.getElementById("message").textContent =
                "Thanks for visiting my profile!";

        }

    </script>

</body>
</html>
